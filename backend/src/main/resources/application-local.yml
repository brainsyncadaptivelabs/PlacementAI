# Local Development Profile - Zero Setup (H2 PostgreSQL Compatibility Mode + Local Redis)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/placementai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  flyway:
    enabled: false
  cache:
    type: redis
  data:
    redis:
      url: redis://localhost:6379

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

app:
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001

frontend:
  url: http://localhost:3000

server:
  port: 8080
