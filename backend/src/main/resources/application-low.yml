spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://127.0.0.1:5432/placementai}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:BrainSyncAdaptiveLabs}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: false
  cache:
    redis:
      time-to-live: 1800000

chatbot:
  context-size: 5
  max-tokens: 500
  truncate-limit: 300
