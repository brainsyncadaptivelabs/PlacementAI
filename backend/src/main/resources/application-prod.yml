logging:
  level:
    root: WARN
    com.aiplacement.backend: INFO

spring:
  datasource:
    hikari:
      maximum-pool-size: 25
      minimum-idle: 10
      connection-timeout: 10000
      idle-timeout: 60000
      max-lifetime: 1800000
  data:
    redis:
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 10s

ratelimit:
  login:
    capacity: 5
    duration-seconds: 60
  signup:
    capacity: 3
    duration-seconds: 3600
  chat:
    capacity: 60
    duration-seconds: 60
  resume-upload:
    capacity: 10
    duration-seconds: 3600
  ats:
    capacity: 20
    duration-seconds: 3600

payment:
  mock:
    enabled: false
